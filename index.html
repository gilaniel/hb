<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sh. A. Cert</title>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .img-wrapper {
        flex: 1;
        min-height: 0; /* важно для flex-контейнера */
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        padding: 24px 0;
      }
      .img-wrapper img {
        max-height: 100%;
        max-width: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div class="img-wrapper">
      <img src="./cert.jpg" alt="" />
    </div>
  </body>
</html>
